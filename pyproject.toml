[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blueferry-shortcuts"
version = "0.2.0"
description = "BlueFerry plugin: receive clipboard, links and battery level from iOS Shortcuts"
readme = "README.md"
license = {text = "GPL-2.0-or-later"}
requires-python = ">=3.10"
# Only blueferry.plugin_api is used from BlueFerry. dbus-python and PyGObject
# come from the distribution (BlueFerry creates the plugin's venv with
# --system-site-packages). The shared plugin kit brings the clipboard,
# address choice, private files and the hardened LAN server; its lanserver
# extra pulls in cryptography for the local certificates.
dependencies = [
  "blueferry-plugin-api @ git+https://github.com/joshii-h/blueferry@plugin-api-v1.3.0#subdirectory=plugin-api",
  "blueferry-plugin-kit[lanserver] @ git+https://github.com/joshii-h/blueferry-plugin-kit@kit-v0.2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7,<10", "ruff>=0.5,<1"]

[project.urls]
Homepage = "https://github.com/joshii-h/blueferry-plugin-shortcuts"
Source = "https://github.com/joshii-h/blueferry-plugin-shortcuts"

[project.scripts]
blueferry-shortcuts = "blueferry_shortcuts.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"blueferry_shortcuts" = ["*.plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["B904", "RUF005", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["blueferry_shortcuts"]
known-third-party = ["blueferry"]
